windowrule = match:initial_class vesktop, workspace 3 silent
windowrule = match:initial_class steam, workspace 4 silent
windowrule = match:initial_class com.github.th_ch.youtube_music, workspace 6 silent

windowrule = match:class mpv, float on
windowrule = match:class mpv, maximize on
windowrule = match:class mpv, center on

windowrule = match:class ^(.*\.exe)$, float on
#windowrule = match:class ^(steam_app_.*)$, float on, fullscreen on
windowrule = match:class ^(steam_app_.*)$, float on
windowrule = match:class ^(steam_app_.*)$, render_unfocused on
#windowrule = match:class ^(wine.*)$, float on, fullscreen on
windowrule = match:class ^(wine.*)$, render_unfocused on

windowrule = match:class .*osu.*, immediate 1

windowrule = opacity 1.0 0.9, match:class kitty

windowrule = float on, match:title SteamVR Status
windowrule = size 400 300, match:title SteamVR Status
windowrule = move 100%-410 40, match:title SteamVR Status

windowrule = float on, match:class BladeAndSorcery
windowrule = size 800 600, match:class BladeAndSorcery
windowrule = center on, match:class BladeAndSorcery

windowrule = float on, match:class UbisoftConnect.exe
windowrule = no_initial_focus on, match:class UbisoftConnect.exe
windowrule = stay_focused on, match:initial_title For Honor®

windowrule = suppress_event maximize, match:class .*
